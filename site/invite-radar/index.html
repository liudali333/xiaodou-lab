<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>小豆邀请码雷达 · Xiaodou Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#162b49;font-family:system-ui,"Microsoft YaHei",sans-serif;line-height:1.65}main{max-width:1000px;margin:auto;padding:30px 20px 60px}header{background:#e1edff;border:1px solid #d1e1fa;border-radius:24px;padding:28px 30px;margin:20px 0}small,.muted{color:#516780}h1{font-size:clamp(30px,5vw,48px);line-height:1.2;margin:12px 0}h2{font-size:20px}a{color:#195cc0}nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}button,input{font:inherit}button,.link{border:1px solid #bad0ee;background:white;color:#1d54a0;padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none}button:hover,.link:hover{background:#eff5ff}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:18px 0}.stat,article,.panel{background:white;border:1px solid #dce5f1;border-radius:16px;padding:18px}.num{font-size:25px;font-weight:750;display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}input{border:1px solid #c9d6e8;border-radius:10px;padding:10px 12px;flex:1;min-width:160px}#list{display:grid;gap:12px}.code{font-family:ui-monospace,monospace;font-size:24px;font-weight:bold;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{font-size:12px;background:#fff0d5;color:#795313;padding:4px 9px;border-radius:20px}.note{font-size:14px}.foot{margin-top:24px;font-size:13px}#message{padding:16px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #4379de;outline-offset:3px}
</style></head><body><main>
<nav><a href="https://github.com/liudali333/xiaodou-lab">← 小豆研究所</a><a href="https://x.com/search?q=%E5%B0%8F%E8%B1%86%20%E9%82%80%E8%AF%B7%E7%A0%81&f=live" target="_blank" rel="noopener noreferrer">查看 X 最新帖子 ↗</a></nav>
<header><small>XIAODOU LAB / INVITE RADAR</small><h1>小豆邀请码雷达</h1><p>发现 X 公开分享的邀请码 · 自动提取 · 去重 · 原帖溯源</p><div class="badge" style="display:inline-block">非官方 · 候选邀请码未经验证</div></header>
<div class="stats"><div class="stat"><small>候选邀请码</small><span class="num" id="count">—</span></div><div class="stat"><small>扫描帖子</small><span class="num" id="scanned">—</span></div><div class="stat"><small>最后更新（本地时间）</small><span id="updated">—</span></div></div>
<div class="panel note">仅搜索公开、疑似主动分享的内容，不自动领取或兑换。请打开原帖核对分享意愿、来源及有效性，不购买邀请码，不提交账号密码或验证码。数据为最近一次扫描的快照，可能存在漏检和误识别。刷新页面不会触发 X API 调用。</div>
<h2>最新候选</h2><div class="toolbar"><input id="search" type="search" placeholder="筛选邀请码" aria-label="筛选邀请码"><button id="refresh">刷新数据</button></div>
<div id="message" role="status" aria-live="polite">正在加载……</div><section id="list" aria-label="候选邀请码列表"></section>
<div class="foot muted">数据来源：X 官方 API · 每小时计划扫描（启用后）· <a href="https://github.com/liudali333/xiaodou-lab">开源代码与部署说明</a></div>
</main><script>
"use strict";
const $=id=>document.getElementById(id); let items=[];
function element(tag, text, cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node;}
function render(){const list=$("list");list.replaceChildren();const q=$("search").value.trim().toLowerCase();for(const item of items.filter(x=>x.code.toLowerCase().includes(q))){if(!/^[A-Za-z0-9_-]{4,20}$/.test(item.code)||!/^\d+$/.test(item.post_id))continue;const article=element("article","");const row=element("div","","row");row.append(element("span",item.code,"code"),element("span","未经验证","badge"));article.append(row,element("p",item.created_at?"原帖时间："+new Date(item.created_at).toLocaleString():"原帖时间未知","muted note"));const buttons=element("div","","row");const link=element("a","查看原帖 ↗","link");link.href="https://x.com/i/web/status/"+item.post_id;link.target="_blank";link.rel="noopener noreferrer";buttons.append(link);article.append(buttons);list.append(article);}if(items.length&&!list.children.length)list.append(element("p","没有匹配的候选。","muted"));}
async function load(){try{$("message").textContent="正在加载……";const res=await fetch("data.json",{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);const data=await res.json();items=Array.isArray(data.items)?data.items.filter(x=>typeof x.code==="string"&&typeof x.post_id==="string"):[];$("count").textContent=items.length;$("scanned").textContent=data.scanned??0;$("updated").textContent=data.updated_at?new Date(data.updated_at).toLocaleString():"尚未运行";$("message").textContent=data.status==="ok"?(items.length?"以下为疑似公开分享的候选码，请先查看原帖。":"本次扫描未发现候选邀请码。"):data.status==="api_error"?"本次 X API 请求失败，请检查授权、额度和运行日志。":"尚未配置 X API 或启用扫描任务。";render();}catch(e){items=[];render();$("count").textContent="—";$("scanned").textContent="—";$("updated").textContent="—";$("message").textContent="数据暂不可读，请稍后刷新或检查部署。";}}
$("refresh").addEventListener("click",load);$("search").addEventListener("input",render);load();
</script></body></html>

name: Invite Radar and Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/invite_radar.py'
      - 'scripts/import_community.py'
      - '.github/workflows/invite-radar.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: invite-radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public posts
        if: vars.ENABLE_X_RADAR == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 * * * *'))
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/invite_radar.py
      - name: Import public community snapshot
        run: python scripts/import_community.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
